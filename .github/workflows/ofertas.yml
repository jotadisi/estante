name: Ofertas da estante

on:
  schedule:
    - cron: "15 12 * * *"   # todo dia às 9h15 de Brasília (o GitHub usa UTC e pode atrasar alguns minutos)
  workflow_dispatch:         # botão "Run workflow" na aba Actions

permissions:
  contents: write   # para publicar ofertas.json e index.html

concurrency:
  group: ofertas-estante
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # O script só usa a biblioteca padrão, então serve o python3 que já vem no servidor.
      - name: Conferir ofertas na Amazon
        env:
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          # A tag de afiliado não é segredo. Se ficasse nos segredos, o GitHub a trocaria por ***.
          AMAZON_PARTNER_TAG: ${{ vars.AMAZON_PARTNER_TAG || 'joaoestudos-20' }}
          OFERTA_MINIMA: ${{ vars.OFERTA_MINIMA }}
        run: python3 ofertas.py

      - name: Gerar a página
        run: python3 gerar.py

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ofertas.json index.html
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Ofertas de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            git push
          fi
